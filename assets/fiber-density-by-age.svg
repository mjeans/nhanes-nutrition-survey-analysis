<text x="710.0" y="137.0" font-size="15" fill="#687b89" text-anchor="start" font-weight="400">Mean (95% CI)</text>
<text x="930.0" y="137.0" font-size="15" fill="#687b89" text-anchor="end" font-weight="400">df</text>
