<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="865" viewBox="0 0 1000 865" role="img" aria-labelledby="title desc">
<title id="title">Adjusted nutrient-density associations</title><desc id="desc">Two separate unit scales display coefficients and t-based 95% confidence intervals. The intercept is omitted. Vertical lines mark zero association; these are not causal effects.</desc>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif">
<text x="40.0" y="46.0" font-size="27" fill="#142d42" text-anchor="start" font-weight="700">Adjusted nutrient-density associations</text>
