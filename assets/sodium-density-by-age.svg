<line x1="570.0" y1="158.0" x2="570.0" y2="360.0" stroke="#dae3e9" stroke-width="1"/>
<text x="570.0" y="390.0" font-size="14" fill="#687b89" text-anchor="middle" font-weight="400">1800</text>
<line x1="630.0" y1="158.0" x2="630.0" y2="360.0" stroke="#dae3e9" stroke-width="1"/>
<text x="630.0" y="390.0" font-size="14" fill="#687b89" text-anchor="middle" font-weight="400">1850</text>
<text x="40.0" y="183.0" font-size="19" fill="#142d42" text-anchor="start" font-weight="700">20-39 years</text>
<text x="40.0" y="207.0" font-size="14" fill="#687b89" text-anchor="start" font-weight="400">n = 1,191</text>
<line x1="439.6" y1="185.0" x2="524.3" y2="185.0" stroke="#087e83" stroke-width="3"/>
<circle cx="482.0" cy="185" r="7" fill="#087e83"/>
