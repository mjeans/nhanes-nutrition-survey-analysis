<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">Survey-weighted sodium density by age</title><desc id="desc">Horizontal points are weighted means, with Taylor-linearized t-based 95% confidence intervals. Age labels include unweighted sample size. The axis is focused, not zero-based.</desc>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif">
