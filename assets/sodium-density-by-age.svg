<text x="40.0" y="76.0" font-size="16" fill="#687b89" text-anchor="start" font-weight="400">NHANES 2017–2018 | adults with two reliable dietary recalls</text>
<line x1="40.0" y1="100.0" x2="960.0" y2="100.0" stroke="#dae3e9" stroke-width="1"/>
<text x="710.0" y="137.0" font-size="15" fill="#687b89" text-anchor="start" font-weight="400">Mean (95% CI)</text>
<text x="930.0" y="137.0" font-size="15" fill="#687b89" text-anchor="end" font-weight="400">df</text>
<line x1="210.0" y1="158.0" x2="210.0" y2="360.0" stroke="#dae3e9" stroke-width="1"/>
<text x="210.0" y="390.0" font-size="14" fill="#687b89" text-anchor="middle" font-weight="400">1500</text>
<line x1="270.0" y1="158.0" x2="270.0" y2="360.0" stroke="#dae3e9" stroke-width="1"/>
<text x="270.0" y="390.0" font-size="14" fill="#687b89" text-anchor="middle" font-weight="400">1550</text>
<line x1="330.0" y1="158.0" x2="330.0" y2="360.0" stroke="#dae3e9" stroke-width="1"/>
<text x="330.0" y="390.0" font-size="14" fill="#687b89" text-anchor="middle" font-weight="400">1600</text>
<line x1="390.0" y1="158.0" x2="390.0" y2="360.0" stroke="#dae3e9" stroke-width="1"/>
<text x="390.0" y="390.0" font-size="14" fill="#687b89" text-anchor="middle" font-weight="400">1650</text>
<line x1="450.0" y1="158.0" x2="450.0" y2="360.0" stroke="#dae3e9" stroke-width="1"/>
<text x="450.0" y="390.0" font-size="14" fill="#687b89" text-anchor="middle" font-weight="400">1700</text>
<line x1="510.0" y1="158.0" x2="510.0" y2="360.0" stroke="#dae3e9" stroke-width="1"/>
