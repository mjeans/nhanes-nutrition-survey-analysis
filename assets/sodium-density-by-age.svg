<text x="40.0" y="283.0" font-size="14" fill="#687b89" text-anchor="start" font-weight="400">n = 1,318</text>
<line x1="331.9" y1="261.0" x2="429.7" y2="261.0" stroke="#087e83" stroke-width="3"/>
