<text x="710.0" y="342.0" font-size="16" fill="#142d42" text-anchor="start" font-weight="400">1628.6 (1592.3, 1664.9)</text>
<text x="930.0" y="342.0" font-size="16" fill="#687b89" text-anchor="end" font-weight="400">15</text>
<text x="420.0" y="426.0" font-size="16" fill="#687b89" text-anchor="middle" font-weight="400">mg per 1,000 kcal (focused scale)</text>
<text x="40.0" y="456.0" font-size="14" fill="#687b89" text-anchor="start" font-weight="400">Source: CDC/NCHS public-use dietary files. Group intervals do not test between-group differences.</text>
</g></svg>
