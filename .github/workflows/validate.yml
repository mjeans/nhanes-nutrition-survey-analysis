name: Validate NHANES nutrition analysis

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1"

permissions:
  contents: read

concurrency:
  group: nhanes-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python tests/test_survey_methods.py
      - name: Reproduce public-data analysis
        run: python scripts/run_analysis.py
      - name: Confirm deterministic outputs
        run: git diff --exit-code
