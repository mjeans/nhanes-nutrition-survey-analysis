name: Validate NHANES nutrition analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python tests/test_survey_methods.py
      - name: Reproduce public-data analysis
        run: python scripts/run_analysis.py
      - name: Confirm deterministic outputs
        run: git diff --exit-code
